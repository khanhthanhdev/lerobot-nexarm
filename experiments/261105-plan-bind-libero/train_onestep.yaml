# Plan-Bind D4: the one-step control on LIBERO. Push-T runs at 10 fps, so the fine knots are every 2 frames
# (0.2 s; uniform cubic fits of the demonstrations miss by a median 3 px, p95 11 px) over a 32-frame window.
# run_all.sh passes the output dir, seed, steps, batch size and workers on the command line.
dataset:
  repo_id: lerobot/libero
  revision: a1aaacb7f6cd6ee5fb43120f673cebb0cfea7dd4

policy:
  type: bspline
  push_to_hub: false
  device: cuda
  # The instruction picks the task inside a scene, so every policy sees it (hashed words).
  task_condition: hash
  resize_shape: [128, 128]
  crop_shape: [120, 120]
  bspline_mode: onestep
  bspline_window: 32
  planbind_fine_spacing: 2
  planbind_subdivision: 4

output_dir: experiments/261105-plan-bind-libero/outputs/full/train_onestep_s1000
job_name: 261105-plan-bind-d4-onestep
seed: 1000
batch_size: 32
steps: 60000
save_freq: 20000
log_freq: 100
env_eval_freq: 0

wandb:
  enable: false
  project: lerobot-nexarm
