# Plan-Bind D4: Plan-Bind on LIBERO. Fine knots every 2 frames, coarse plan knots every 8 (0.8 s), plans
# replaced when older than 16 frames (1.6 s); the 32-frame window as for onestep. run_all.sh passes the output
# dir, seed, steps, batch size and workers on the command line.
dataset:
  repo_id: lerobot/libero
  revision: a1aaacb7f6cd6ee5fb43120f673cebb0cfea7dd4

policy:
  type: bspline
  push_to_hub: false
  device: cuda
  # The instruction picks the task inside a scene, so every policy sees it (hashed words).
  task_condition: hash
  resize_shape: [128, 128]
  crop_shape: [120, 120]
  bspline_mode: planbind
  bspline_window: 32
  planbind_fine_spacing: 2
  planbind_subdivision: 4
  planbind_max_plan_age: 16
  planbind_plan_noise: 0.02

output_dir: experiments/261105-plan-bind-libero/outputs/full/train_planbind_s1000
job_name: 261105-plan-bind-d4-planbind
seed: 1000
batch_size: 32
steps: 60000
save_freq: 20000
log_freq: 100
env_eval_freq: 0

wandb:
  enable: false
  project: lerobot-nexarm
