# Plan-Bind D1 (RQ1): bsp10 on the NexArm stack-bowls sim dataset. run_all.sh passes the dataset root,
# output dir, steps, batch size and workers on the command line; the values here are the defaults.
dataset:
  repo_id: local/nexarm_stack_bowls
  root: outputs/datasets/nexarm_stack_bowls

policy:
  type: bspline
  push_to_hub: false
  device: cuda
  # Same image size, window and fine knot grid in all three configs, so the comparison stays fair.
  resize_shape: [120, 160]
  bspline_window: 64
  planbind_fine_spacing: 4
  planbind_subdivision: 4
  bspline_mode: diffusion
  # Diffusion ceiling: DDIM with 10 denoising steps. Evaluated at latency 0 only (no latency machinery).
  noise_scheduler_type: DDIM
  num_inference_steps: 10

output_dir: experiments/261027-plan-bind-two-step/outputs/full/train_bsp10
job_name: 261027-plan-bind-bsp10
seed: 1000
# Batch 16 used 7.2 GB at 120x160 with three cameras (RTX 5050); 32 should fit a 24 GB RTX 3090.
batch_size: 32
steps: 60000
save_freq: 10000
log_freq: 100
env_eval_freq: 0

wandb:
  enable: false
  project: lerobot-nexarm
