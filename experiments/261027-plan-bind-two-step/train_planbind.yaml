# Plan-Bind D1 (RQ1): planbind on the NexArm stack-bowls sim dataset. run_all.sh passes the dataset root,
# output dir, steps, batch size and workers on the command line; the values here are the defaults.
dataset:
  repo_id: local/nexarm_stack_bowls
  root: outputs/datasets/nexarm_stack_bowls

policy:
  type: bspline
  push_to_hub: false
  device: cuda
  # Same image size, window and fine knot grid in all three configs, so the comparison stays fair.
  resize_shape: [120, 160]
  bspline_window: 64
  planbind_fine_spacing: 4
  planbind_subdivision: 4
  # Plan (coarse spline) then Bind (residual on its exact lift), one shared UNet.
  bspline_mode: planbind
  planbind_max_plan_age: 32
  planbind_plan_noise: 0.02

output_dir: experiments/261027-plan-bind-two-step/outputs/full/train_planbind
job_name: 261027-plan-bind-planbind
seed: 1000
# Batch 16 used 7.2 GB at 120x160 with three cameras (RTX 5050); 32 should fit a 24 GB RTX 3090.
batch_size: 32
steps: 60000
save_freq: 10000
log_freq: 100
env_eval_freq: 0

wandb:
  enable: false
  project: lerobot-nexarm
