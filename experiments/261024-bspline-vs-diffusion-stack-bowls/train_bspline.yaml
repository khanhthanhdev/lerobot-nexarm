# B-spline Policy on the NexArm stack-bowls sim dataset. Load with:
#   uv run lerobot-train --config_path experiments/261024-bspline-vs-diffusion-stack-bowls/train_bspline.yaml
dataset:
  repo_id: local/nexarm_stack_bowls
  root: outputs/datasets/nexarm_stack_bowls
  # revision: <commit hash or tag of the dataset version you trained on>

policy:
  type: bspline
  push_to_hub: false
  # 480x640 frames at batch 8 already exceed 8 GB; at 120x160, batch 32 fits (about 3.5 steps/s on an RTX 5050).
  # Keep the same value in both configs so the comparison stays fair. Drop it on larger GPUs.
  resize_shape: [120, 160]

output_dir: experiments/261024-bspline-vs-diffusion-stack-bowls/outputs/train_bspline
job_name: 261024-bspline-stack-bowls
seed: 1000
batch_size: 64
steps: 100000
save_freq: 25000
log_freq: 100
env_eval_freq: 0

wandb:
  enable: true
  project: lerobot-nexarm
