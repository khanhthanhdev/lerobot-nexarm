# Update the serial ports, camera indexes, and repo_id before recording.
robot:
  type: nexarm_follower
  port: /dev/ttyUSB1
  baudrate: 1000000
  motion_acc: 100
  motion_speed: 2000
  cameras:
    front:
      type: opencv
      index_or_path: 0
      width: 640
      height: 480
      fps: 30
    wrist:
      type: opencv
      index_or_path: 1
      width: 640
      height: 480
      fps: 30
    # RealSense D435i top camera (on by default). The name works when exactly one D435i is
    # connected; otherwise use its serial number. Delete this block to run without a top camera.
    top:
      type: intelrealsense
      serial_number_or_name: "Intel RealSense D435I"
      width: 640
      height: 480
      fps: 30

teleop:
  type: nexarm_leader
  port: /dev/ttyUSB0
  baudrate: 1000000

dataset:
  repo_id: local/nexarm_pick
  single_task: Pick up the object
  num_episodes: 50
  episode_time_s: 10
  reset_time_s: 10
  fps: 30
  video: true
  push_to_hub: false

display_data: false
play_sounds: true
