name: nexarm-joint-bspline

shape_meta: &shape_meta
  obs:
    front_image:
      shape: [3, 128, 128]
      type: rgb
    joint_pos:
      shape: [6]

  # 5 arm joints + gripper, absolute joint targets (same units as observation.state).
  # No rotation conversion: raw dim == target dim, so the loader passes actions through.
  action:
    shape: [6]

dataset_path: &dataset_path /home/25thanh.tk/lerobot-nexarm/data/nexarm_bspline.hdf5
abs_action: &abs_action True

env_runner:
  _target_: diffusion_policy.env_runner.real_pusht_image_runner.RealPushTImageRunner

dataset:
  _target_: bspline_policy.dataset.robomimic_replay_bspline_image_dataset.RobomimicReplayBSplineImageDataset
  shape_meta: *shape_meta
  dataset_path: *dataset_path
  horizon: ${horizon}
  pad_before: 0
  pad_after: 0
  n_obs_steps: ${dataset_obs_steps}
  abs_action: *abs_action
  rotation_rep: 'rotation_6d'
  bspline_degree: 3
  chunk_size: ${eval:'${horizon}-2*${task.dataset.bspline_degree}'}
  max_error: 0.002
  stride: 1
  relative_knots: false
  use_cache: True
  cache_suffix: nexarm_joint_v1
  seed: 42
  val_ratio: 0.05
