# The NexArm workspace root. LeRobot itself comes from upstream, pinned by commit in [tool.uv.sources];
# this project only holds the NexArm plugins (packages/), the research policies (policies/) and the tool
# configuration. It is never built or published.

[project]
name = "lerobot-nexarm"
version = "0.1.0"
description = "Hiwonder NexArm on LeRobot: robot, teleoperator and env plugins, research policies and tools."
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = ["lerobot"]

[project.urls]
source = "https://github.com/Hiwonder-official/lerobot-nexarm"
issues = "https://github.com/Hiwonder-official/lerobot-nexarm/issues"
upstream = "https://github.com/huggingface/lerobot"

# The extras the NexArm guides use. Most forward to the pinned lerobot's extra of the same name; add one here
# (`name = ["lerobot[name]"]`) to use another upstream extra.
[project.optional-dependencies]
all = ["lerobot[all]"]
core_scripts = ["lerobot[core_scripts]"]
dataset = ["lerobot[dataset]"]
dataset_viz = ["lerobot[dataset_viz]"]
dev = ["lerobot[dev]"]
diffusion = ["lerobot[diffusion]"]
feetech = ["lerobot[feetech]"]
hardware = ["lerobot[hardware]"]
intelrealsense = ["lerobot[intelrealsense]"]
libero = ["lerobot[libero]"]
pi = ["lerobot[pi]"]
smolvla = ["lerobot[smolvla]"]
test = ["lerobot[test]", "xacro>=2.0.0,<3.0.0"]
training = ["lerobot[training]"]
viz = ["lerobot[viz]"]
# NexArm robot, teleoperator and env plugins from packages/. Plain `uv sync` also installs them through the
# `nexarm` dependency group.
nexarm = ["lerobot_robot_nexarm", "lerobot_teleoperator_nexarm", "lerobot_env_nexarm"]
# Local engine behind the NexArm desktop app (lerobot-nexarm-service).
service = ["nexarm_service"]
# TurboVLA: the model package comes from its own repo, pinned by commit in [tool.uv.sources], and the
# workspace plugin `policies/lerobot_policy_turbovla` registers it as `--policy.type=turbovla`.
turbovla = ["lerobot[transformers-dep]", "turbovla", "lerobot_policy_turbovla"]

# cu128 wheels keep broad hardware reach; the driver floor is 570.86.
# To use a different CUDA variant, reinstall torch with an explicit index, e.g.:
#   uv pip install --force-reinstall torch torchvision \
#       --index-url https://download.pytorch.org/whl/cu130
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Research policies and NexArm plugin packages install as workspace members.
[tool.uv.workspace]
members = ["policies/*", "packages/*"]

# Plain `uv sync` installs the workspace policy and NexArm plugins through these default groups.
[dependency-groups]
policies = ["lerobot_policy_bspline"]
nexarm = ["lerobot_robot_nexarm", "lerobot_teleoperator_nexarm", "lerobot_env_nexarm"]

[tool.uv]
package = false
default-groups = ["policies", "nexarm"]

[tool.uv.sources]
# Upstream LeRobot. To upgrade: bump `rev`, run `uv lock`, then the tests (see CONTRIBUTING.md).
lerobot = { git = "https://github.com/huggingface/lerobot", rev = "d3793b7e36522321c1c455f0dc4826db3793dceb" }
lerobot_policy_bspline = { workspace = true }
lerobot_policy_turbovla = { workspace = true }
lerobot_env_nexarm = { workspace = true }
lerobot_robot_nexarm = { workspace = true }
lerobot_teleoperator_nexarm = { workspace = true }
nexarm_service = { workspace = true }
# Bump `rev` to a pushed TurboVLA commit. For local TurboVLA development, temporarily use
# `turbovla = { path = "../TurboVLA", editable = true }` and never commit it (see docs/source/nexarm/turbovla_guide.md).
turbovla = { git = "https://github.com/khanhthanhdev/TurboVLA", rev = "28bc1e7e8cf259aacee4fd928258caa669cbaaae" }
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
# LeRobot decodes videos on CPU; avoid GPU-only TorchCodec dependencies without changing GPU training.
torchcodec = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'AMD64')" }]

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = [
    "firmware",
    "tests/artifacts/**/*.safetensors",
    "*_pb2.py",
    "*_pb2_grpc.py",
    "TurboVLA",
]
[tool.ruff.lint]
# E, W: pycodestyle errors and warnings
# F: PyFlakes
# I: isort
# UP: pyupgrade
# B: flake8-bugbear (good practices, potential bugs)
# C4: flake8-comprehensions (more concise comprehensions)
# A: flake8-builtins (shadowing builtins)
# SIM: flake8-simplify
# RUF: Ruff-specific rules
# D: pydocstyle (for docstring style/formatting)
# S: flake8-bandit (some security checks, complements Bandit)
# T20: flake8-print (discourage print statements in production code)
# N: pep8-naming
# TODO: Uncomment rules when ready to use
select = [
    "E", "W", "F", "I", "B", "C4", "T20", "N", "UP", "SIM", "D" #, "A", "S", "RUF"
]
ignore = [
    "E501", # Line too long
    "T201", # Print statement found
    "T203", # Pprint statement found
    "B008", # Perform function call in argument defaults
    "UP042", # Preserve explicit str/Enum bases used throughout the public API
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "E402", "D104"]
# D (pydocstyle) is enabled globally; this code is still on the old docstring style.
"tests/**" = ["D"]
"policies/*/tests/**" = ["D"]
"examples/**" = ["D"]
"tools/**" = ["D"]
"scripts/**" = ["D"]
"packages/**" = ["D"]
"sim/**" = ["D"]
"plans/**" = ["D"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["lerobot", "lerobot_env_nexarm", "lerobot_robot_nexarm", "lerobot_teleoperator_nexarm", "nexarm_service"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.bandit]
exclude_dirs = [
    "tests",
    "firmware",
]
skips = ["B101", "B311", "B404", "B603", "B615"]

[tool.typos]
default.extend-words = { trak = "trak", nd = "nd", Softwares = "Softwares", finsh = "finsh" }
default.extend-ignore-re = [
    "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",                      # spellchecker:disable-line
    "(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on", # spellchecker:<on|off>
]
default.extend-ignore-identifiers-re = [
    # Add individual words here to ignore them
    "2nd",
    "pn",
    "ser",
    "ein",
    "thw",
    "inpt",
    "arange",
    "is_compileable",
    "ROBOTIS",
    "OT_VALUE",
    "VanderBilt",
    "seperated_timestep",
    "nd",  # einsum output axes "...nd" in the vendored FLUX 3 Action transformer
    "EmbedND",
]

[tool.pytest.ini_options]
# The tests import the example and tool scripts as `examples.nexarm.*` and `tools.nexarm.*`.
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "skip"
# Paths the hook checks as a whole (pass_filenames: false); keep its `files` pattern in sync.
files = [
    "packages/lerobot_robot_nexarm/src",
    "packages/lerobot_teleoperator_nexarm/src",
    "packages/lerobot_env_nexarm/src",
    "packages/nexarm_service/src",
    "scripts",
]
exclude = ['_pb2(_grpc)?\.py$']
exclude_gitignore = true
warn_redundant_casts = true
extra_checks = true
strict_bytes = true
strict_equality = true
local_partial_types = true
implicit_reexport = false
warn_unused_ignores = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "ignore-without-code",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unused-awaitable",
]
# Next candidates, each needing a fix PR first (error counts as of 2026-09):
# warn_unreachable = true          # 40: dead code, mostly unannotated `self.x = None` attributes
# strict_equality_for_none = true  # 40: keep None guards on config fields, `--field=null` yields None
# check_untyped_defs = true        # 195: most valuable; decide first how Optional dataset metadata is accessed

# ZeroMQ's public stubs re-export names from Python modules. Follow those modules
# to retain their types instead of treating the re-exported names as missing.
[[tool.mypy.overrides]]
module = ["zmq", "zmq.*"]
follow_imports = "silent"
