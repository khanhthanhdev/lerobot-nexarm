# This workflow validates each optional-dependency tier in isolation.
# Each tier installs a different extra and runs the full test suite.
# Tests that require an extra not installed in the current tier are
# skipped automatically via pytest.importorskip guards.
# This workflow runs the NexArm and research-policy tests against the pinned upstream lerobot.
# Hardware is mocked; the MuJoCo tests render offscreen through EGL.
name: NexArm Tests

on:
  # Allows running this workflow manually from the Actions tab
  workflow_dispatch:

  pull_request:
    branches:
      - main
    paths:
      - "packages/**"
      - "policies/**"
      - "tests/**"
      - "examples/nexarm/**"
      - "tools/**"
      - "sim/**"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - "policies/**"
      - "tests/**"
      - "examples/nexarm/**"
      - "tools/**"
      - "sim/**"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"

# Sets up the environment variables
env:
  UV_VERSION: "0.11.30"
  PYTHON_VERSION: "3.12"

# Ensures that only the latest commit for a PR or branch is built, canceling older runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  nexarm-tests:
    permissions:
      contents: read
    name: NexArm Tests
    runs-on: ubuntu-latest
    env:
      MUJOCO_GL: egl
      HF_HOME: /mnt/cache/.cache/huggingface
      HF_LEROBOT_HOME: /mnt/cache/.cache/huggingface/lerobot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          lfs: true

      # Mount to `/mnt` to avoid the limited storage on `/home`.
      - name: Setup /mnt storage
        run: sudo chown -R $USER:$USER /mnt

      - name: Install apt dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential git \
          curl libglib2.0-0 libegl1-mesa-dev ffmpeg \
          libusb-1.0-0-dev speech-dispatcher libgeos-dev portaudio19-dev

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: >-
          uv sync --locked --extra test --extra core_scripts --extra training --extra nexarm
          --extra intelrealsense --extra turbovla --extra service

      - name: Test
        run: uv run pytest tests policies -vv --maxfail=10

      - name: NexArm sim end-to-end
        run: make test-nexarm-ete
